# Example .devtools.toml for a project that uses the phase workflow and the component index.
# Copy it to the project root, adjust the values, then run:
#   python3 <dev-tools>/devtools/sync.py apply --project .
# In a new project, follow with:
#   python3 .claude/skills/process-phase/scripts/phase_tool.py setup

# Commands the project runs after a sync that changed a file. This one regenerates the
# component index (its first run also writes a starter catalog).
after_apply = ["python3 scripts/components_index.py write"]

[[sync]]
source = "skills/phase/process-phase"
dest = ".claude/skills/process-phase"
# Files in this directory that the project keeps as its own instead of the shipped ones.
# exclude = ["scripts/gates.json"]

[sync.settings."scripts/phase_tool.settings.json"]
planning_dir = ".planning"
acceptance_dir = "tests/acceptance"
golden_dir = "tests/golden"
package_prefix = "myapp"
skill_roots = [".claude/skills"]
agents_dir = ".claude/agents"
components_catalog = "docs/components/COMPONENTS.md"
capabilities_script = ""
capabilities_target = "docs/CAPABILITIES.md"
process_skill = ".claude/skills/process-phase"
branch_prefix = "phase/"
# First status at which `advance` blocks on missing files. A project whose earlier phases
# ran when the first two steps only warned keeps "plan_approved".
gated_from = "context_approved"
# true accepts a roadmap whose phase numbers do not start at 0 or 1, or skip some: a
# project that moved from GSD keeps the numbers its phases had.
phase_gaps = false
# Which skills and agents `check --all` holds to the skill rules: "all" in the folders
# above, or "synced" for only the ones this file delivers. Use "synced" when those folders
# also hold skills or agents of the project's own, or another tool's.
skill_check = "all"
# Generated files that two plans of one wave may both name (a path, a folder ending in /, or
# a pattern with *), beside the component index, which always is one. `check --plans` reads it.
shared_files = []

# Where the coding assistants for Implement are configured (`coder_pool.py show` reads
# both). The team file is checked in; the local one is each developer's own: add it to
# .gitignore. With neither file the pool is codex, 4 tracks, 4 sessions per account.
[sync.settings."scripts/coder_pool.settings.json"]
team_config = ".devtools/coders.toml"
local_config = ".devtools/coders.local.toml"

# The skill that writes a phase's acceptance tests, and the helper agents the steps use.
[[sync]]
source = "skills/phase/phase-tests"
dest = ".claude/skills/phase-tests"

[[sync]]
source = "agents"
dest = ".claude/agents"

# Selecting tests by phase (`pytest --phase NN`). A project that already has a root
# conftest.py uses dest = "phase_selection.py" and adds `pytest_plugins = ["phase_selection"]`
# to its own conftest.py.
[[sync]]
source = "skills/phase/pytest/phase_selection.py"
dest = "conftest.py"

# The component index: the skill (with its build and review guides) and its script. The
# script is delivered once, to scripts/, by the entry after this one.
[[sync]]
source = "skills/components"
dest = ".claude/skills/components"
exclude = ["scripts/components_index.py"]

# Optional: the project's own rules about its components (references/rules.md in the
# skill). The check needs GND; without it the check prints `skip:` and passes.
# [sync.settings."scripts/rules_check.settings.json"]
# index_script = "scripts/components_index.py"
# gnd_command = "uvx --from 'get-nick-done[synth] @ git+https://github.com/vasiloglou/gnd-public@v0.3.1' gnd"
# Where the phase tool is, for rules about the plans of a phase (`check --phase NN`).
# phase_script = ".claude/skills/process-phase/scripts/phase_tool.py"

[[sync]]
source = "skills/components/scripts/components_index.py"
dest = "scripts/components_index.py"

[sync.settings."components_index.settings.json"]
package_dir = "src/myapp"
import_prefix = "myapp"
extra_source_dirs = []
docs_dir = "docs/components"
script_path = "scripts/components_index.py"
# verb_list = "shared"   # for a large catalog: list only the verbs two or more entries use

# handle-issue reads a GitHub issue, reproduces and classes it, and routes it to a fix, the
# plan or a reply. It has no values or settings of its own.
[[sync]]
source = "skills/handle-issue"
dest = ".claude/skills/handle-issue"

# dev-handoff writes the branch's hand-off note and sends the files git ignores when work
# moves to another assistant, account or machine; dev-takeover is the receiving side and
# runs dev-handoff's script, so both go in the same skills folder.
[[sync]]
source = "skills/dev-handoff"
dest = ".claude/skills/dev-handoff"

# The hand-off script (scripts/handoff.py). Every key is optional; these are the defaults.
[sync.settings."scripts/handoff.settings.json"]
# The notes are in <planning_dir>/handoffs/, one per branch. Keep this the same as the
# workflow's planning folder.
planning_dir = ".planning"
# The branch work branches start from. Empty: the base_branch in .planning/STATE.md, else origin's
# default branch, else main or master.
base_branch = ""
# An ignored path over this size is reported, not carried.
max_mb = 200
# More ignored paths the receiver rebuilds instead of copying, such as "reports/cache/".
rebuild_paths = []
# What a machine needs before the work can continue there: commands on PATH (such as "uv",
# "gh"), paths the checkout has once it is set up (such as ".venv") and the command that
# creates them (such as "uv sync --frozen"), and files under the home directory the
# project's runs read. Only whether a key file exists is ever reported.
tools = []
env_paths = []
setup_command = ""
key_files = []

[[sync]]
source = "skills/dev-takeover"
dest = ".claude/skills/dev-takeover"

# Optional: a GitHub Actions job that runs the index check on every pull request.
# [[sync]]
# source = "examples/components-check.yml"
# dest = ".github/workflows/components-check.yml"

# Optional: a GitHub Actions job that checks the project's own rules on every pull request.
# [[sync]]
# source = "examples/rules-check.yml"
# dest = ".github/workflows/rules-check.yml"
