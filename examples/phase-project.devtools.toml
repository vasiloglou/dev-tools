# Example .devtools.toml for a project that uses the phase workflow and the component index.
# Copy it to the project root, adjust the values, then run:
#   python3 <dev-tools>/devtools/sync.py apply --project .
# In a new project, follow with:
#   python3 .claude/skills/process-phase/scripts/phase_tool.py setup

# Commands the project runs after a sync that changed a file. This one regenerates the
# component index (its first run also writes a starter catalog).
after_apply = ["python3 scripts/components_index.py write"]

[[sync]]
source = "skills/phase/process-phase"
dest = ".claude/skills/process-phase"
# Files in this directory that the project keeps as its own instead of the shipped ones.
# exclude = ["scripts/gates.json"]

[sync.settings."scripts/phase_tool.settings.json"]
planning_dir = ".planning"
acceptance_dir = "tests/acceptance"
golden_dir = "tests/golden"
package_prefix = "myapp"
skill_roots = [".claude/skills"]
agents_dir = ".claude/agents"
components_catalog = "docs/components/COMPONENTS.md"
capabilities_script = ""
capabilities_target = "docs/CAPABILITIES.md"
process_skill = ".claude/skills/process-phase"
branch_prefix = "phase/"
# First status at which `advance` blocks on missing files. A project whose earlier phases
# ran when the first two steps only warned keeps "plan_approved".
gated_from = "context_approved"

# Where the coding assistants for Implement are configured (`coder_pool.py show` reads
# both). The team file is checked in; the local one is each developer's own: add it to
# .gitignore. With neither file the pool is codex, 4 tracks, 4 sessions per account.
[sync.settings."scripts/coder_pool.settings.json"]
team_config = ".devtools/coders.toml"
local_config = ".devtools/coders.local.toml"

# The skill that writes a phase's acceptance tests, and the helper agents the steps use.
[[sync]]
source = "skills/phase/phase-tests"
dest = ".claude/skills/phase-tests"

[[sync]]
source = "agents"
dest = ".claude/agents"

# Selecting tests by phase (`pytest --phase NN`). A project that already has a root
# conftest.py uses dest = "phase_selection.py" and adds `pytest_plugins = ["phase_selection"]`
# to its own conftest.py.
[[sync]]
source = "skills/phase/pytest/phase_selection.py"
dest = "conftest.py"

# The component index: the skill (with its build and review guides) and its script. The
# script is delivered once, to scripts/, by the entry after this one.
[[sync]]
source = "skills/components"
dest = ".claude/skills/components"
exclude = ["scripts/components_index.py"]

[[sync]]
source = "skills/components/scripts/components_index.py"
dest = "scripts/components_index.py"

[sync.settings."components_index.settings.json"]
package_dir = "src/myapp"
import_prefix = "myapp"
extra_source_dirs = []
docs_dir = "docs/components"
script_path = "scripts/components_index.py"
# verb_list = "shared"   # for a large catalog: list only the verbs two or more entries use

# Optional: a GitHub Actions job that runs the index check on every pull request.
# [[sync]]
# source = "examples/components-check.yml"
# dest = ".github/workflows/components-check.yml"
