# Example .devtools.toml for a project that uses the milestone workflow.
# Copy it to the project root, set planning_dir, then run:
#   python3 <dev-tools>/devtools/sync.py apply --project .
#
# `values` fills the planning folder into the skills' text. Each milestone's records go in
# <planning_dir>/milestones/<milestone>/. The one script, process-phase's review helper
# (scripts/review_tool.py), takes the settings below. The project's own rules for the skills
# go in .claude/skills/process-phase/references/project.md, which the sync never touches.
#
# If the project's .gitignore leaves the synced files out, apply says so. Under a rule
# `.claude/skills/*`, add `!.claude/skills/<name>/` for each folder below; a rule that
# excludes `.claude/skills/` itself must become `.claude/skills/*` first, since git does not
# look inside an excluded folder. `git check-ignore -v <file>` names the rule.

[[sync]]
source = "skills/milestone/start-milestone"
dest = ".claude/skills/start-milestone"
values = { planning_dir = ".planning" }

[[sync]]
source = "skills/milestone/process-milestone"
dest = ".claude/skills/process-milestone"
values = { planning_dir = ".planning" }

[[sync]]
source = "skills/milestone/process-phase"
dest = ".claude/skills/process-phase"
values = { planning_dir = ".planning" }

# The review helper (scripts/review_tool.py). Every key is optional; these are the defaults.
[sync.settings."scripts/review_tool.settings.json"]
# codex, claude, or auto: the other harness from the one driving the work.
reviewer = "auto"
# The Codex model; empty for Codex's own default.
codex_model = ""
codex_effort = "high"
# The Claude model for claude -p, when Codex drives.
claude_model = "opus"
# A review still running after this many minutes is stopped and recorded as failed.
timeout_minutes = 60

# review-pr drives process-phase's review helper for a pull request, so it goes in the same
# skills folder as process-phase. It has no values or settings of its own.
[[sync]]
source = "skills/milestone/review-pr"
dest = ".claude/skills/review-pr"

# handle-issue reads a GitHub issue, reproduces and classes it, and routes it to a fix, the
# plan or a reply. It has no values or settings of its own.
[[sync]]
source = "skills/handle-issue"
dest = ".claude/skills/handle-issue"

# dev-handoff writes the branch's hand-off note and sends the files git ignores when work
# moves to another assistant, account or machine; dev-takeover is the receiving side and
# runs dev-handoff's script, so both go in the same skills folder.
[[sync]]
source = "skills/dev-handoff"
dest = ".claude/skills/dev-handoff"

# The hand-off script (scripts/handoff.py). Every key is optional; these are the defaults.
[sync.settings."scripts/handoff.settings.json"]
# The notes are <planning_dir>/handoffs/<branch>.md.
planning_dir = ".planning"
# The branch work branches start from. Empty: origin's default branch, else main or master.
base_branch = ""
# An ignored path over this size is reported, not carried.
max_mb = 200
# More ignored paths the receiver rebuilds instead of copying, such as "reports/cache/".
rebuild_paths = []
# What a machine needs before the work can continue there: commands on PATH (such as "uv",
# "gh"), paths the checkout has once it is set up (such as ".venv") and the command that
# creates them (such as "uv sync --frozen"), and files under the home directory the
# project's runs read. Only whether a key file exists is ever reported.
tools = []
env_paths = []
setup_command = ""
key_files = []

[[sync]]
source = "skills/dev-takeover"
dest = ".claude/skills/dev-takeover"

# A second agent runtime (Codex reads .codex/skills or .agents/skills) gets a second entry
# per skill with the same values. If that folder is a link to .claude/skills, add none:
# the sync refuses two destinations that are one file.
# [[sync]]
# source = "skills/milestone/process-phase"
# dest = ".agents/skills/process-phase"
# values = { planning_dir = ".planning" }
