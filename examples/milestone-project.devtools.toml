# Example .devtools.toml for a project that uses the milestone workflow.
# Copy it to the project root, set planning_dir, then run:
#   python3 <dev-tools>/devtools/sync.py apply --project .
#
# The three skills ship no script and take no settings: `values` fills the planning folder
# into their text. Each milestone's records go in <planning_dir>/milestones/<milestone>/.
# The project's own rules for the skills go in
# .claude/skills/process-phase/references/project.md, which the sync never touches.
#
# If the project's .gitignore leaves out .claude/skills/, apply says so: add an exception
# for each folder below, or the synced files stay out of the repository.

[[sync]]
source = "skills/milestone/start-milestone"
dest = ".claude/skills/start-milestone"
values = { planning_dir = ".planning" }

[[sync]]
source = "skills/milestone/process-milestone"
dest = ".claude/skills/process-milestone"
values = { planning_dir = ".planning" }

[[sync]]
source = "skills/milestone/process-phase"
dest = ".claude/skills/process-phase"
values = { planning_dir = ".planning" }

# A second agent runtime (Codex reads .codex/skills or .agents/skills) gets a second entry
# per skill with the same values. If that folder is a link to .claude/skills, add none:
# the sync refuses two destinations that are one file.
# [[sync]]
# source = "skills/milestone/process-phase"
# dest = ".agents/skills/process-phase"
# values = { planning_dir = ".planning" }
